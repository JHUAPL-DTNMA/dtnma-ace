[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtnma-ace"
version = "2.3.1"
authors = [
  { name="JHU/APL", email="dtnma-support@jhuapl.edu" },
]
description = "DTNMA AMM CODEC Engine (ACE)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
  "cbor2 ~=5.6.4", # specific patch version for tag 100 fix
  "cbor-diag",
  "numpy ~=2.0.2",
  "PLY >= 3",
  "portion ~=2.4",
  "pyang ~=2.6",
  "setuptools",
  "sqlalchemy >= 1.3",
  "xdg-base-dirs ~=6.0; python_version>='3.10'",
  "xdg ~=5.1; python_version<'3.10'",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-subtests",
  "pytest-cov",
  "coverage",
]
pylint = [
  "pylint",
  "pylint_junit",
]
flake8 = [
  "flake8",
  "flake8_pyproject",
  "flake8_formatter_junit_xml",
]
format = [
  "ruff ==0.16.0",
  "licenseheaders ==0.8.8",
]
docs = [
  "sphinx <6",
  "sphinx_rtd_theme",
  "sphinx-argparse",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "test",
]
log_cli = true
log_cli_level = "CRITICAL"

[tool.coverage.run]
relative_files = true
branch = true

[tool.pylint.MAIN]
load-plugins="pylint_junit"
suggestion-mode="no"
[tool.pylint.FORMAT]
max-line-length=100
[tool.pylint.DESIGN]
min-public-methods=1

[tool.autopep8]
max_line_length = 120

[tool.flake8]
max-line-length=120

[tool.ruff]
line-length=120
[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[project.scripts]
ace_ari = "ace.tools.ace_ari:main"
ace_adm = "ace.tools.ace_adm:main"

[project.urls]
"Homepage" = "https://github.com/JHUAPL-DTNMA/dtnma-ace"
"Bug Tracker" = "https://github.com/JHUAPL-DTNMA/dtnma-ace/issues"
